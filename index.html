<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Locator</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --background-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background-color);
      color: var(--text-main);
      line-height: 1.5;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    header { margin-bottom: 30px; text-align: center; }
    h1 { font-size: 2rem; margin-bottom: 20px; color: var(--primary-color); }
    #search-input {
      width: 100%; max-width: 500px; padding: 12px 20px;
      font-size: 1rem; border: 2px solid #e5e7eb;
      border-radius: 8px; outline: none; transition: border-color 0.2s ease;
    }
    #search-input:focus { border-color: var(--primary-color); }
    .house-list { list-style-type: none; display: flex; flex-direction: column; gap: 15px; }
    .house-item {
      background-color: var(--card-bg); border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .house-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
    }
    .house-link {
      display: block; padding: 20px; text-decoration: none;
      color: var(--text-main); font-size: 1.1rem; font-weight: 600;
    }
    .house-link::after {
      content: "📍 View on Map"; display: block; font-size: 0.875rem;
      color: var(--primary-color); margin-top: 8px; font-weight: normal;
    }
    .hidden { display: none; }
    #no-results { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 1.1rem; }
    @media (max-width: 600px) {
      h1 { font-size: 1.75rem; }
      .house-link { font-size: 1rem; padding: 15px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>House Locator</h1>
      <input type="text" id="search-input" placeholder="Search for a house... (e.g., Loft, Miami)" autocomplete="off">
    </header>
    <main>
      <ul id="house-list" class="house-list"></ul>
      <div id="no-results" class="hidden"><p>No houses found matching your search.</p></div>
    </main>
  </div>

  <script>
    const housesData = [
      { title: "Sunny Villa, Los Angeles",       url: "https://www.google.com/maps/search/?api=1&query=34.0522,-118.2437" },
      { title: "Oceanview Condo, Miami",          url: "https://www.google.com/maps/search/?api=1&query=25.7617,-80.1918" },
      { title: "Mountain Cabin, Denver",          url: "https://www.google.com/maps/search/?api=1&query=39.7392,-104.9903" },
      { title: "Downtown Apartment, New York",    url: "https://www.google.com/maps/search/?api=1&query=40.7128,-74.0060" },
      { title: "Lakeside Retreat, Chicago",       url: "https://www.google.com/maps/search/?api=1&query=41.8781,-87.6298" },
      { title: "Desert Oasis, Phoenix",           url: "https://www.google.com/maps/search/?api=1&query=33.4484,-112.0740" },
      { title: "Historic Townhouse, Boston",      url: "https://www.google.com/maps/search/?api=1&query=42.3601,-71.0589" },
      { title: "Modern Loft, Seattle",            url: "https://www.google.com/maps/search/?api=1&query=47.6062,-122.3321" },
      { title: "Suburban Family Home, Dallas",    url: "https://www.google.com/maps/search/?api=1&query=32.7767,-96.7970" },
      { title: "Country Estate, Nashville",       url: "https://www.google.com/maps/search/?api=1&query=36.1627,-86.7816" }
    ];

    const searchInput = document.getElementById('search-input');
    const houseList   = document.getElementById('house-list');
    const noResults   = document.getElementById('no-results');

    function renderHouses(houses) {
      houseList.innerHTML = '';
      if (houses.length === 0) {
        noResults.classList.remove('hidden');
      } else {
        noResults.classList.add('hidden');
        houses.forEach(h => {
          const li = document.createElement('li');
          li.className = 'house-item';
          const a = document.createElement('a');
          a.className = 'house-link';
          a.href = h.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = h.title;
          li.appendChild(a);
          houseList.appendChild(li);
        });
      }
    }

    function debounce(fn, delay) {
      let t;
      return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), delay); };
    }

    function handleSearch(e) {
      const term = e.target.value.toLowerCase().trim();
      renderHouses(housesData.filter(h => h.title.toLowerCase().includes(term)));
    }

    searchInput.addEventListener('input', debounce(handleSearch, 600));
    renderHouses(housesData);
  </script>
</body>
</html>
